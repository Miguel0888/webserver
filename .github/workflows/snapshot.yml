name: Snapshot

on:
  push:
    branches: [master, main]

permissions:
  contents: write

jobs:
  snapshot:
    # Windows-Runner, damit das ZIP die caddy.exe für die Zielplattform enthält
    # und die Caddy-in-the-loop-Integrationstests das echte Binary nutzen.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build distribution
        run: ./gradlew.bat test distZip

      - name: Rotate previous snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete snapshot --yes --cleanup-tag || true

      - name: Publish snapshot release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create snapshot \
            build/distributions/*.zip \
            --prerelease \
            --title "Snapshot $(date -u +%Y-%m-%d) (${GITHUB_SHA::7})" \
            --notes "Automatischer Snapshot-Build von \`${GITHUB_SHA}\`.

          Enthält die Windows-Distribution mit gebündeltem, checksummen-verifiziertem Caddy.
          Wird bei jedem Push ersetzt — kein stabiles Release."
